<script async src="https://www.googletagmanager.com/gtag/js?id=G-TCJJ8T1KNY"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
let consent = null;
try { consent = localStorage.getItem("ga-consent"); } catch (e) {}
gtag("consent", "default", { analytics_storage: consent === "yes" ? "granted" : "denied", ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied" });
gtag("js", new Date());
gtag("config", "G-TCJJ8T1KNY");
</script>

<script src="works.js?v=da6e2d55"></script>
<script src="app.js?v=742b1506"></script>
<div class="consent" id="consent" hidden>
  <p id="consent-text"></p>
  <button type="button" data-ok="yes" id="consent-yes"></button><button type="button" data-ok="no" id="consent-no"></button>
</div>
<script>
(() => {
  let saved = null;
  try { saved = localStorage.getItem("ga-consent"); } catch (e) {}
  if (saved) return;
  const ru = document.documentElement.lang === "ru";
  const box = document.getElementById("consent");
  document.getElementById("consent-text").textContent = ru
    ? "Сайт использует Google Analytics, чтобы понимать, сколько людей его смотрит."
    : "This site uses Google Analytics to see how many people visit.";
  document.getElementById("consent-yes").textContent = ru ? "Ок" : "OK";
  document.getElementById("consent-no").textContent = ru ? "Нет" : "No";
  box.hidden = false;
  box.addEventListener("click", (e) => {
    const ok = e.target.dataset.ok;
    if (!ok) return;
    try { localStorage.setItem("ga-consent", ok); } catch (e) {}
    if (ok === "yes") gtag("consent", "update", { analytics_storage: "granted" });
    box.hidden = true;
  });
})();
</script>
